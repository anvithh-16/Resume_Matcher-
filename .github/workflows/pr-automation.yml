name: PR automation
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: anvithh-16
          BACKUP: ankitharevadal
        run: |
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-assignee "$AUTHOR" --add-label "sprint-2"
          if [ "$AUTHOR" = "$OWNER" ]; then R="$BACKUP"; else R="$OWNER"; fi
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-reviewer "$R" || true
