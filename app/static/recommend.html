<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Matcher – Recommendations</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
  <div class="page-icon" aria-hidden="true">✨</div>
  <h1>Recommendations</h1>
  <p class="page-desc">The assistant reads your resume, searches the job list, scores every match and ranks the best ones. It never applies to jobs for you.</p>
  <div id="msg" aria-live="polite"></div>

  <form id="rec-form" class="form-row">
    <div>
      <label for="resume">My resume</label>
      <select id="resume" required></select>
    </div>
    <div>
      <label for="location">Location (optional)</label>
      <input id="location" type="text" placeholder="e.g. Bengaluru" autocomplete="off">
    </div>
    <div>
      <label for="topk">How many</label>
      <select id="topk">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="10">10</option>
      </select>
    </div>
    <button type="submit">Get recommendations</button>
  </form>

  <section id="results" aria-live="polite"></section>

  <hr class="divider">
  <section aria-labelledby="ai-title">
    <h2 id="ai-title" style="margin-top:0;font-size:18px">AI explanations</h2>
    <p class="muted" id="notice" style="margin-bottom:12px"></p>
    <div class="callout" style="display:block">
      <div class="switch-row">
        <label for="consent">Allow sending job titles and skill names to the AI provider</label>
        <span class="switch"><input id="consent" type="checkbox" role="switch"><span aria-hidden="true"></span></span>
      </div>
      <p class="muted" style="margin-top:8px">Provider configured: <strong id="configured">…</strong></p>
    </div>
  </section>
</main>

<script src="/app.js"></script>
<script>
  requireLogin();
  renderNav();

  const msg = document.getElementById("msg");
  const resumeSel = document.getElementById("resume");
  const results = document.getElementById("results");
  const consentBox = document.getElementById("consent");
  const params = new URLSearchParams(location.search);

  const STEP_TEXT = {
    get_resume_profile: "Read the skills from your resume",
    search_jobs: "Searched the job list for those skills",
    score_jobs: "Scored each job against your resume",
    rank_results: "Ranked the jobs by score",
  };

  function card(r, i) {
    return `<details class="toggle"${i === 0 ? " open" : ""}>
      <summary>
        <span class="row-title"><span class="rank">${i + 1}</span>${escHtml(r.title)}
          <span class="row-meta" style="display:block;margin-left:18px">${escHtml(r.company)}, ${escHtml(r.location)}</span></span>
        <span class="score ${scoreClass(r.score)}">${r.score}</span>
      </summary>
      <div class="toggle-body">
        ${(r.warnings || []).map((w) => `<p class="msg error" role="note">${escHtml(w)}</p>`).join("")}
        <div class="props">
          <div class="prop"><div class="prop-key"><span aria-hidden="true">✅</span>Skills you have</div>
            <div class="prop-val">${tagList(r.matched_skills, "green", "None")}</div></div>
          <div class="prop"><div class="prop-key"><span aria-hidden="true">➕</span>Skills to learn</div>
            <div class="prop-val">${tagList(r.missing_skills, "red", "Nothing missing")}</div></div>
        </div>
        <h3 style="font-size:15px">Why</h3>
        ${bulletList(r.explanation, "No explanation available")}
        <div class="actions">
          <a class="btn" href="/match.html?job_id=${r.job_id}&resume_id=${resumeSel.value}">Open full match</a>
          <button type="button" data-bookmark="${r.job_id}" aria-label="Bookmark ${escHtml(r.title)}">Bookmark</button>
          <button type="button" data-track="${r.job_id}" aria-label="Track application for ${escHtml(r.title)}">Track application</button>
        </div>
      </div>
    </details>`;
  }

  function wireButtons() {
    results.querySelectorAll("[data-bookmark]").forEach((b) => b.onclick = async () => {
      try { await api("/bookmarks", { method: "POST", json: { job_id: Number(b.dataset.bookmark) } }); showMessage(msg, "Bookmarked.", false); }
      catch (err) { showMessage(msg, err.message, true); }
    });
    results.querySelectorAll("[data-track]").forEach((b) => b.onclick = async () => {
      try { await api("/applications", { method: "POST", json: { job_id: Number(b.dataset.track) } }); showMessage(msg, "Added to My applications.", false); }
      catch (err) { showMessage(msg, err.message, true); }
    });
  }

  document.getElementById("rec-form").onsubmit = async (e) => {
    e.preventDefault();
    results.innerHTML = '<p class="muted" style="margin-top:20px">Finding jobs for you…</p>';
    try {
      const loc = document.getElementById("location").value.trim();
      const body = await api("/recommendations", { method: "POST", json: {
        resume_id: Number(resumeSel.value), location: loc || null, top_k: Number(document.getElementById("topk").value) } });
      const recs = body.recommendations;
      results.innerHTML =
        `<div class="view-head"><span class="view-name"><span aria-hidden="true">☰</span>Top matches</span>
           <span class="view-count">${recs.length} ${recs.length === 1 ? "job" : "jobs"}</span></div>` +
        (recs.length ? '<div class="dblist">' + recs.map(card).join("") + "</div>" : "") +
        `<div class="callout"><span class="callout-icon" aria-hidden="true">🤖</span><div>
           <p><strong>How these were picked</strong></p>
           <ol class="steps">${body.tool_trace.map((t) => `<li>${escHtml(STEP_TEXT[t] || t)} <code>${escHtml(t)}</code></li>`).join("")}</ol>
           <p class="muted">External AI calls: ${body.external_calls}. ${escHtml(body.note)}</p>
         </div></div>`;
      if (body.guidance) showMessage(msg, body.guidance, true);
      else showMessage(msg, recs.length + " recommendations ready.", false);
      wireButtons();
    } catch (err) {
      results.innerHTML = "";
      showMessage(msg, err.message, true);
    }
  };

  consentBox.onchange = async () => {
    try {
      const c = await api("/consent", { method: "PUT", json: { external_ai_enabled: consentBox.checked } });
      showMessage(msg, c.external_ai_enabled ? "AI explanations allowed." : "AI explanations turned off.", false);
    } catch (err) { showMessage(msg, err.message, true); }
  };

  async function init() {
    const [resumes, consent] = await Promise.all([api("/resumes"), api("/consent")]);
    if (!resumes.resumes.length) {
      results.innerHTML = `<div class="callout"><span class="callout-icon" aria-hidden="true">📄</span>
        <p>Upload a resume first, then come back here. <a href="/resume.html">Go to My resume</a></p></div>`;
      document.querySelector("#rec-form button").disabled = true;
    } else {
      resumeSel.innerHTML = resumes.resumes.map((r) => `<option value="${r.id}">${escHtml(r.filename)}</option>`).join("");
      if (params.get("resume_id")) resumeSel.value = params.get("resume_id");
    }
    document.getElementById("notice").textContent = consent.notice;
    consentBox.checked = consent.external_ai_enabled;
    document.getElementById("configured").textContent = consent.provider_configured ? "yes" : "no";
  }

  init().catch((err) => showMessage(msg, err.message, true));
</script>
</body>
</html>
