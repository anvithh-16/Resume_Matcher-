<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Matcher – My applications</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page wide board-page">
  <div class="page-icon" aria-hidden="true">🗂️</div>
  <h1>My applications</h1>
  <p class="page-desc">Keep track of where each application stands. This board only records your progress; the system never submits applications for you.</p>
  <div id="msg" aria-live="polite"></div>
  <div id="list"></div>
</main>

<script src="/app.js"></script>
<script>
  requireLogin();
  renderNav();

  const msg = document.getElementById("msg");
  const list = document.getElementById("list");
  const label = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function bcard(a, statuses) {
    const opts = statuses.map((s) => `<option value="${s}"${s === a.status ? " selected" : ""}>${label(s)}</option>`).join("");
    return `<article class="bcard">
      <h2>${escHtml(a.title)}</h2>
      <div class="meta">${escHtml(a.company)}</div>
      <label for="status-${a.id}">Status<span class="sr-only"> for ${escHtml(a.title)}</span></label>
      <select id="status-${a.id}">${opts}</select>
      <label for="notes-${a.id}">Notes<span class="sr-only"> for ${escHtml(a.title)}</span></label>
      <input id="notes-${a.id}" type="text" value="${escHtml(a.notes || "")}" maxlength="1000" placeholder="Add a note">
      <div class="actions">
        <span class="updated">Updated ${escHtml(new Date(a.updated_at).toLocaleDateString(undefined, { day: "numeric", month: "short" }))}</span>
        <button type="button" data-save="${a.id}" aria-label="Save ${escHtml(a.title)}">Save</button>
      </div>
    </article>`;
  }

  async function load() {
    const data = await api("/applications");
    if (!data.applications.length) {
      list.innerHTML = `<div class="callout"><span class="callout-icon" aria-hidden="true">🗂️</span>
        <p>You are not tracking any applications yet. Use Track on a job in <a href="/jobs.html">Find jobs</a> to add one.</p></div>`;
      return;
    }
    list.innerHTML =
      `<div class="view-head"><span class="view-name"><span aria-hidden="true">▥</span>Board</span>
         <span class="view-count">${data.applications.length} tracked</span></div>
       <div class="board">` +
      data.statuses.map((s) => {
        const items = data.applications.filter((a) => a.status === s);
        return `<section class="lane" aria-label="${label(s)}">
          <div class="lane-head"><span class="tag ${STATUS_COLORS[s] || "gray"}">${label(s)}</span><span class="lane-count">${items.length}</span></div>
          <div class="lane-cards">${items.length ? items.map((a) => bcard(a, data.statuses)).join("") : '<p class="lane-empty">No applications</p>'}</div>
        </section>`;
      }).join("") + "</div>";
    list.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
      const id = b.dataset.save;
      try {
        await api("/applications/" + id, { method: "PATCH", json: {
          status: document.getElementById("status-" + id).value,
          notes: document.getElementById("notes-" + id).value } });
        showMessage(msg, "Saved.", false);
        load();
      } catch (err) { showMessage(msg, err.message, true); }
    });
  }

  load().catch((err) => showMessage(msg, err.message, true));
</script>
</body>
</html>
