<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Matcher – My resume</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
  <div class="page-icon" aria-hidden="true">📄</div>
  <h1>My resume</h1>
  <p class="page-desc">Upload your resume and check what we read from it. Matching and recommendations use the skills listed here, so fix anything that's wrong.</p>
  <div id="msg" aria-live="polite"></div>

  <form id="upload-form">
    <div class="dropzone" id="drop">
      <label for="file"><span class="dropzone-title">Choose a resume file or drop it here</span></label>
      <span class="muted">PDF, DOCX or TXT, up to 2 MB</span>
      <span class="dropzone-file" id="file-name" aria-live="polite"></span>
      <input id="file" type="file" accept=".pdf,.docx,.txt" required>
    </div>
    <div class="actions"><button type="submit">Upload and read resume</button></div>
  </form>

  <div class="view-head">
    <h2 class="view-name" style="margin:0">Uploaded resumes</h2>
    <span class="view-count" id="resume-count"></span>
  </div>
  <div id="list"></div>
</main>

<script src="/app.js"></script>
<script>
  requireLogin();
  renderNav();

  const msg = document.getElementById("msg");
  const list = document.getElementById("list");
  const fileInput = document.getElementById("file");
  const drop = document.getElementById("drop");

  fileInput.onchange = () => {
    document.getElementById("file-name").textContent = fileInput.files[0] ? fileInput.files[0].name : "";
  };
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, () => drop.classList.add("over")));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("over")));

  function prop(icon, key, value) {
    return `<div class="prop"><div class="prop-key"><span aria-hidden="true">${icon}</span>${key}</div><div class="prop-val">${value}</div></div>`;
  }

  function card(r) {
    const p = r.profile || {}, c = p.contact || {};
    const uploaded = new Date(r.created_at).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    return `<article class="doc">
      <h2><span aria-hidden="true">📄</span>${escHtml(r.filename)}</h2>
      ${(p.warnings || []).map((w) => `<p class="msg error" role="note">${escHtml(w)}</p>`).join("")}
      <div class="props">
        ${prop("✉️", "Email", c.email ? escHtml(c.email) : '<span class="empty-val">Not found</span>')}
        ${prop("📞", "Phone", c.phone ? escHtml(c.phone) : '<span class="empty-val">Not found</span>')}
        ${prop("🗓️", "Uploaded", escHtml(uploaded))}
        ${prop("🏷️", "Skills", tagList(p.skills, null, "No skills found"))}
      </div>
      <form class="skill-edit" data-fix="${r.id}">
        <label for="skills-${r.id}" class="sr-only">Skills for ${escHtml(r.filename)}, separated by commas</label>
        <input id="skills-${r.id}" type="text" value="${escHtml((p.skills || []).join(", "))}" placeholder="python, sql, git">
        <button type="submit" class="btn-secondary">Save skills</button>
      </form>
      <h3>Education</h3>${bulletList(p.education, "Not found in your resume")}
      <h3>Experience</h3>${bulletList(p.experience, "Not found in your resume")}
      <div class="actions">
        <a class="btn btn-primary" href="/recommend.html?resume_id=${r.id}">Get recommendations</a>
        <a class="btn" href="/match.html?resume_id=${r.id}">Match against a job</a>
        <button type="button" class="btn-danger" data-del="${r.id}">Delete this resume and its data</button>
      </div>
    </article>`;
  }

  async function load() {
    const data = await api("/resumes");
    document.getElementById("resume-count").textContent = data.resumes.length ? String(data.resumes.length) : "";
    list.innerHTML = data.resumes.length
      ? data.resumes.map(card).join("")
      : `<div class="callout"><span class="callout-icon" aria-hidden="true">💡</span>
           <p>No resume uploaded yet. Upload one above to see your skills and get job matches.</p></div>`;
    list.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
      if (!confirm("Delete this resume and all extracted data?")) return;
      try {
        await api("/resumes/" + b.dataset.del, { method: "DELETE" });
        showMessage(msg, "Resume deleted.", false);
        load();
      } catch (err) { showMessage(msg, err.message, true); }
    });
    list.querySelectorAll("[data-fix]").forEach((f) => f.onsubmit = async (e) => {
      e.preventDefault();
      const id = f.dataset.fix;
      const r = data.resumes.find((x) => String(x.id) === id);
      const skills = document.getElementById("skills-" + id).value.split(",").map((s) => s.trim()).filter(Boolean);
      try {
        await api(`/resumes/${id}/profile`, { method: "PUT", json: {
          skills, education: (r.profile || {}).education || [], experience: (r.profile || {}).experience || [] } });
        showMessage(msg, "Skills saved.", false);
        load();
      } catch (err) { showMessage(msg, err.message, true); }
    });
  }

  document.getElementById("upload-form").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData();
    fd.append("file", fileInput.files[0]);
    try {
      await api("/resumes", { method: "POST", body: fd });
      showMessage(msg, "Uploaded. Check the details we read from your resume below.", false);
      e.target.reset();
      document.getElementById("file-name").textContent = "";
      load();
    } catch (err) { showMessage(msg, err.message, true); }
  };

  load().catch((err) => showMessage(msg, err.message, true));
</script>
</body>
</html>
