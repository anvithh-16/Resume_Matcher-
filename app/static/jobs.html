<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Matcher – Find jobs</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page wide">
  <div class="page-icon" aria-hidden="true">🔎</div>
  <h1>Find jobs</h1>
  <p class="page-desc">Search the job list by keyword, skill, location or job type. Open any job to see how well your resume matches it.</p>
  <div id="msg" aria-live="polite"></div>

  <form id="search-form" class="filters">
    <div>
      <label for="q">Keyword</label>
      <input id="q" type="text" placeholder="e.g. developer" autocomplete="off">
    </div>
    <div>
      <label for="skill">Skill</label>
      <input id="skill" type="text" placeholder="e.g. python" autocomplete="off">
    </div>
    <div>
      <label for="location">Location</label>
      <input id="location" type="text" placeholder="e.g. Bengaluru" autocomplete="off">
    </div>
    <div>
      <label for="employment_type">Job type</label>
      <select id="employment_type">
        <option value="">Any</option>
        <option value="full-time">Full-time</option>
        <option value="part-time">Part-time</option>
        <option value="internship">Internship</option>
        <option value="contract">Contract</option>
      </select>
    </div>
    <button type="submit">Search</button>
  </form>

  <div class="view-head">
    <span class="view-name"><span aria-hidden="true">▦</span>Gallery</span>
    <span class="view-count" id="count" aria-live="polite"></span>
  </div>
  <div id="results"></div>
</main>

<script src="/app.js"></script>
<script>
  requireLogin();
  renderNav();

  const msg = document.getElementById("msg");
  const results = document.getElementById("results");
  const count = document.getElementById("count");

  function card(j) {
    return `<article class="gcard">
      <h2>${escHtml(j.title)}</h2>
      <div class="meta">${escHtml(j.company)}, ${escHtml(j.location)}</div>
      <ul class="tags"><li class="tag ${TYPE_COLORS[j.employment_type] || "gray"}">${escHtml(j.employment_type)}</li></ul>
      <p class="desc">${escHtml(j.description)}</p>
      ${tagList(j.required_skills, null, "No skills listed")}
      <div class="actions">
        <a class="btn" href="/match.html?job_id=${j.id}">Match my resume</a>
        <button type="button" data-bookmark="${j.id}" aria-label="Bookmark ${escHtml(j.title)}">Bookmark</button>
        <button type="button" data-track="${j.id}" aria-label="Track application for ${escHtml(j.title)}">Track</button>
      </div>
    </article>`;
  }

  async function search() {
    const params = new URLSearchParams();
    for (const id of ["q", "skill", "location", "employment_type"]) {
      const v = document.getElementById(id).value.trim();
      if (v) params.set(id, v);
    }
    const data = await api("/jobs?" + params.toString());
    count.textContent = data.count + (data.count === 1 ? " job found" : " jobs found");
    results.innerHTML = data.count
      ? '<div class="gallery">' + data.results.map(card).join("") + "</div>"
      : `<div class="callout"><span class="callout-icon" aria-hidden="true">🔍</span>
           <p>No jobs match these filters. Remove a filter or try a broader skill name.</p></div>`;
    results.querySelectorAll("[data-bookmark]").forEach((b) => b.onclick = async () => {
      try { await api("/bookmarks", { method: "POST", json: { job_id: Number(b.dataset.bookmark) } }); showMessage(msg, "Bookmarked.", false); }
      catch (err) { showMessage(msg, err.message, true); }
    });
    results.querySelectorAll("[data-track]").forEach((b) => b.onclick = async () => {
      try { await api("/applications", { method: "POST", json: { job_id: Number(b.dataset.track) } }); showMessage(msg, "Added to My applications.", false); }
      catch (err) { showMessage(msg, err.message, true); }
    });
  }

  document.getElementById("search-form").onsubmit = (e) => {
    e.preventDefault();
    search().catch((err) => showMessage(msg, err.message, true));
  };

  search().catch((err) => showMessage(msg, err.message, true));
</script>
</body>
</html>
