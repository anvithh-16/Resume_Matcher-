<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Matcher – Sign in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Resume Matcher</h1>
  <p>Match scores are assistive signals, not hiring decisions.</p>
  <div id="msg" aria-live="polite"></div>
  <form id="login-form">
    <h2>Log in</h2>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" required autocomplete="email">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" required autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
  <form id="register-form">
    <h2>Create an account</h2>
    <label for="reg-email">Email</label>
    <input id="reg-email" type="email" required autocomplete="email">
    <label for="reg-password">Password (at least 8 characters)</label>
    <input id="reg-password" type="password" minlength="8" required autocomplete="new-password">
    <button type="submit">Register</button>
  </form>
</main>
<script src="/app.js"></script>
<script>
  const msg = document.getElementById("msg");
  const val = (id) => document.getElementById(id).value;
  document.getElementById("login-form").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api("/auth/login", { method: "POST", json: { email: val("login-email"), password: val("login-password") } });
      sessionStorage.setItem("token", r.access_token);
      location.href = "/resume.html";
    } catch (err) { showMessage(msg, err.message, true); }
  };
  document.getElementById("register-form").onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api("/auth/register", { method: "POST", json: { email: val("reg-email"), password: val("reg-password") } });
      showMessage(msg, "Account created. Now log in above.", false);
    } catch (err) { showMessage(msg, err.message, true); }
  };
</script>
</body>
</html>
