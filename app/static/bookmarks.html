<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Matcher – Bookmarks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
  <div class="page-icon" aria-hidden="true">🔖</div>
  <h1>Bookmarks</h1>
  <p class="page-desc">Jobs you saved to look at later.</p>
  <div id="msg" aria-live="polite"></div>
  <div id="list"></div>
</main>
<script src="/app.js"></script>
<script>
  requireLogin();
  renderNav();
  const msg = document.getElementById("msg");
  const list = document.getElementById("list");

  async function load() {
    try {
      const data = await api("/bookmarks");
      if (!data.bookmarks.length) {
        list.innerHTML = `<div class="callout"><span class="callout-icon" aria-hidden="true">🔖</span>
          <p>No bookmarks yet. Use Bookmark on any job in <a href="/jobs.html">Find jobs</a> or Recommendations.</p></div>`;
        return;
      }
      list.innerHTML =
        `<div class="view-head"><span class="view-name"><span aria-hidden="true">☰</span>Saved jobs</span>
           <span class="view-count">${data.bookmarks.length}</span></div><div class="dblist">` +
        data.bookmarks.map((b) => `
        <div class="row">
          <div>
            <h2 class="row-title" style="font-size:15px;margin:0">${escHtml(b.title)}</h2>
            <div class="row-meta">${escHtml(b.company)}, ${escHtml(b.location)}</div>
          </div>
          <div class="actions">
            <a class="btn" href="/match.html?job_id=${b.job_id}">Match</a>
            <button type="button" class="btn-danger" data-id="${b.job_id}" aria-label="Remove bookmark for ${escHtml(b.title)}">Remove</button>
          </div>
        </div>`).join("") + "</div>";
    } catch (err) { showMessage(msg, err.message, true); }
  }

  list.addEventListener("click", async (e) => {
    const id = e.target.dataset && e.target.dataset.id;
    if (!id) return;
    try {
      await api("/bookmarks/" + id, { method: "DELETE" });
      showMessage(msg, "Bookmark removed.", false);
      load();
    } catch (err) { showMessage(msg, err.message, true); }
  });

  load();
</script>
</body>
</html>
